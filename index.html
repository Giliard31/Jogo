<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Jogo 3D - Passo 2</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h2>Projeto: Cópia Hello Neighbor (Passo 2)</h2>
        <p><strong>Controles:</strong> Clique na tela para travar o mouse.</p>
        <p>Use <strong>W, A, S, D</strong> para andar.</p>
        <p>Chegue perto da caixa vermelha e aperte <strong>E</strong> para pegar.</p>
        <p>Clique com o <strong>Botão Esquerdo</strong> para arremessar.</p>
    </div>
    
    <div id="crosshair"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();

        // Variáveis do Sistema de Interação
        let heldObject = null;
        let mysteryBox;
        const raycaster = new THREE.Raycaster();

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            scene.fog = new THREE.FogExp2(0x1a1a1a, 0.03);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.6;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);
            
            document.body.addEventListener('click', () => {
                if (!controls.isLocked) {
                    controls.lock();
                } else if (heldObject) {
                    // Arremessar objeto se estiver segurando e clicar
                    throwObject();
                }
            });

            scene.add(controls.getObject());

            window.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = true; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                    case 'KeyD': case 'ArrowRight': moveRight = true; break;
                    case 'KeyE': togglePickUp(); break; // Tecla E para pegar/soltar
                }
            });

            window.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = false; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                    case 'KeyD': case 'ArrowRight': moveRight = false; break;
                }
            });

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
            sunLight.position.set(10, 20, 10);
            scene.add(sunLight);

            const floorGeo = new THREE.PlaneGeometry(40, 40);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.9 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x8c6239, roughness: 0.7 });
            const wallBack = new THREE.Mesh(new THREE.BoxGeometry(40, 5, 1), wallMat);
            wallBack.position.set(0, 2.5, -20);
            scene.add(wallBack);

            const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(1, 5, 40), wallMat);
            wallLeft.position.set(-20, 2.5, 0);
            scene.add(wallLeft);

            // Nossa Caixa Misteriosa Interativa
            const boxGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xcc0000 });
            mysteryBox = new THREE.Mesh(boxGeo, boxMat);
            mysteryBox.position.set(0, 0.75, -5);
            scene.add(mysteryBox);

            window.addEventListener('resize', onWindowResize);
        }

        function togglePickUp() {
            if (heldObject) {
                // Soltar no chão perto do jogador
                scene.add(heldObject);
                const cameraDirection = new THREE.Vector3();
                camera.getWorldDirection(cameraDirection);
                heldObject.position.copy(camera.position).add(cameraDirection.multiplyScalar(2));
                heldObject.position.y = 0.75;
                heldObject = null;
            } else {
                // Tenta pegar se estiver perto da mysteryBox
                const distance = camera.position.distanceTo(mysteryBox.position);
                if (distance < 4) {
                    heldObject = mysteryBox;
                    scene.remove(mysteryBox);
                }
            }
        }

        function throwObject() {
            if (heldObject) {
                scene.add(heldObject);
                const cameraDirection = new THREE.Vector3();
                camera.getWorldDirection(cameraDirection);
                heldObject.position.copy(camera.position).add(cameraDirection.multiplyScalar(1.5));
                
                // Simples impulso de arremesso guardado no objeto
                heldObject.userData.velocity = cameraDirection.multiplyScalar(15);
                heldObject = null;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 35.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 35.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // Se estiver segurando o objeto, faz ele acompanhar a câmera (posição das mãos)
                if (heldObject) {
                    const handOffset = new THREE.Vector3(0.8, -0.5, -2);
                    handOffset.applyQuaternion(camera.quaternion);
                    heldObject.position.copy(camera.position).add(handOffset);
                }
            }

            // Atualiza física básica de arremesso se houver impulso aplicado
            if (mysteryBox.userData && mysteryBox.userData.velocity && heldObject !== mysteryBox) {
                mysteryBox.position.addScaledVector(mysteryBox.userData.velocity, 0.016);
                mysteryBox.userData.velocity.multiplyScalar(0.95); // Atrito do ar
                if (mysteryBox.position.y < 0.75) mysteryBox.position.y = 0.75;
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
