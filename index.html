<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nosso Jogo 3D - Versão Final Completa</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #555;
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        #alert {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #ff3333;
            font-size: 26px;
            font-weight: bold;
            display: none;
            text-shadow: 2px 2px 6px #000;
        }
        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            background: rgba(0,0,0,0.8);
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="hud">
        <h2>Projeto: Cópia Hello Neighbor (Completo)</h2>
        <p>Use <strong>W, A, S, D</strong> para andar.</p>
        <p>Aperte <strong>E</strong> na caixa vermelha para pegar/soltar.</p>
        <p>Clique esquerdo para arremessar.</p>
    </div>
    
    <div id="crosshair"></div>
    <div id="alert">⚠️ ELE TE VIU! CORRE!</div>
    <div id="instructions">Clique em qualquer lugar da tela para iniciar e travar o mouse</div>

    <!-- Bibliotecas 3D via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let prevTime = performance.now();
        let velocity = new THREE.Vector3();
        let direction = new THREE.Vector3();

        let heldObject = null;
        let mysteryBox;

        let neighbor;
        let neighborState = "PATROL"; // PATROL ou CHASE
        let patrolTarget = new THREE.Vector3(12, 0.9, 12);
        const neighborSpeed = 3.8;

        init();
        animate();

        function init() {
            // 1. Cena e Iluminação
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x151518);
            scene.fog = new THREE.FogExp2(0x151518, 0.035);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.6;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            controls = new THREE.PointerLockControls(camera, document.body);
            
            document.body.addEventListener('click', () => {
                if (!controls.isLocked) {
                    controls.lock();
                    document.getElementById('instructions').style.display = 'none';
                } else if (heldObject) {
                    throwObject();
                }
            });

            scene.add(controls.getObject());

            // 2. Controles de Teclado
            window.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = true; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = true; break;
                    case 'KeyD': case 'ArrowRight': moveRight = true; break;
                    case 'KeyE': togglePickUp(); break;
                }
            });

            window.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW': case 'ArrowUp': moveForward = false; break;
                    case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
                    case 'KeyS': case 'ArrowDown': moveBackward = false; break;
                    case 'KeyD': case 'ArrowRight': moveRight = false; break;
                }
            });

            // Luzes
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 0.7);
            sunLight.position.set(10, 25, 10);
            scene.add(sunLight);

            // 3. Cenário (Casa / Chão e Paredes)
            const floorGeo = new THREE.PlaneGeometry(50, 50);
            const floorMat = new THREE.MeshStandardMaterial({ color: 0x3d2817, roughness: 0.8 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            const wallMat = new THREE.MeshStandardMaterial({ color: 0x7a5230, roughness: 0.7 });
            
            // Paredes Externas da Casa
            const wallBack = new THREE.Mesh(new THREE.BoxGeometry(50, 6, 1), wallMat);
            wallBack.position.set(0, 3, -25);
            scene.add(wallBack);

            const wallFront = new THREE.Mesh(new THREE.BoxGeometry(50, 6, 1), wallMat);
            wallFront.position.set(0, 3, 25);
            scene.add(wallFront);

            const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(1, 6, 50), wallMat);
            wallLeft.position.set(-25, 3, 0);
            scene.add(wallLeft);

            const wallRight = new THREE.Mesh(new THREE.BoxGeometry(1, 6, 50), wallMat);
            wallRight.position.set(25, 3, 0);
            scene.add(wallRight);

            // 4. Objetos do Jogo (Caixa Interativa)
            const boxGeo = new THREE.BoxGeometry(1.5, 1.5, 1.5);
            const boxMat = new THREE.MeshStandardMaterial({ color: 0xcc0000, roughness: 0.3 });
            mysteryBox = new THREE.Mesh(boxGeo, boxMat);
            mysteryBox.position.set(0, 0.75, -6);
            scene.add(mysteryBox);

            // 5. O Vizinho (IA de Perseguição)
            const neighborGeo = new THREE.BoxGeometry(1.3, 2.6, 1.3);
            const neighborMat = new THREE.MeshStandardMaterial({ color: 0x0055ff, roughness: 0.4 });
            neighbor = new THREE.Mesh(neighborGeo, neighborMat);
            neighbor.position.set(12, 1.3, 12);
            scene.add(neighbor);

            window.addEventListener('resize', onWindowResize);
        }

        function togglePickUp() {
            if (heldObject) {
                scene.add(heldObject);
                const cameraDirection = new THREE.Vector3();
                camera.getWorldDirection(cameraDirection);
                heldObject.position.copy(camera.position).add(cameraDirection.multiplyScalar(2.5));
                heldObject.position.y = 0.75;
                heldObject = null;
            } else {
                const distance = camera.position.distanceTo(mysteryBox.position);
                if (distance < 4.5) {
                    heldObject = mysteryBox;
                    scene.remove(mysteryBox);
                }
            }
        }

        function throwObject() {
            if (heldObject) {
                scene.add(heldObject);
                const cameraDirection = new THREE.Vector3();
                camera.getWorldDirection(cameraDirection);
                heldObject.position.copy(camera.position).add(cameraDirection.multiplyScalar(1.5));
                heldObject.userData.velocity = cameraDirection.multiplyScalar(18);
                heldObject = null;
            }
        }

        function updateNeighbor(delta) {
            const distanceToPlayer = neighbor.position.distanceTo(camera.position);

            // Sistema de Visão / Alerta
            if (distanceToPlayer < 14) {
                neighborState = "CHASE";
                document.getElementById('alert').style.display = 'block';
            } else if (distanceToPlayer > 22) {
                neighborState = "PATROL";
                document.getElementById('alert').style.display = 'none';
            }

            if (neighborState === "CHASE") {
                neighbor.lookAt(camera.position.x, neighbor.position.y, camera.position.z);
                neighbor.translateZ(neighborSpeed * delta);
            } else {
                const distToPatrol = neighbor.position.distanceTo(patrolTarget);
                if (distToPatrol < 2) {
                    patrolTarget.set(
                        (Math.random() - 0.5) * 35,
                        1.3,
                        (Math.random() - 0.5) * 35
                    );
                }
                neighbor.lookAt(patrolTarget);
                neighbor.translateZ((neighborSpeed * 0.45) * delta);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            if (controls.isLocked === true) {
                const delta = (time - prevTime) / 1000;

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 35.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 35.0 * delta;

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                if (heldObject) {
                    const handOffset = new THREE.Vector3(0.8, -0.4, -2);
                    handOffset.applyQuaternion(camera.quaternion);
                    heldObject.position.copy(camera.position).add(handOffset);
                }

                updateNeighbor(delta);
            }

            // Física simples para o objeto arremessado
            if (mysteryBox.userData && mysteryBox.userData.velocity && heldObject !== mysteryBox) {
                mysteryBox.position.addScaledVector(mysteryBox.userData.velocity, 0.016);
                mysteryBox.userData.velocity.multiplyScalar(0.92);
                if (mysteryBox.position.y < 0.75) mysteryBox.position.y = 0.75;
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
